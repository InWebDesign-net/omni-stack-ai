name: CI

on:
  push:
    branches:
      - main
  pull_request:

# The job only reads the repository and builds it, so that is all the token can
# do. Without this block the workflow inherits the repository default, which on
# older repositories is read *and write* — and this workflow runs on every pull
# request, including from forks, where `npm ci` executes dependency install
# scripts. A token that cannot write is one less thing for that code to reach.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omni_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: 'npm'

      # actions/setup-node restores all of ~/.npm, including _cacache/tmp.
      # Stale entries there make `npm ci` abort with EEXIST on a cache hit.
      - name: Clear stale npm cache tmp
        run: rm -rf ~/.npm/_cacache/tmp

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          APP_KEYS: "dummy,keys"
          API_TOKEN_SALT: "dummySalt"
          ADMIN_JWT_SECRET: "dummySecret"
          TRANSFER_TOKEN_SALT: "dummySalt2"
          JWT_SECRET: "dummyJwtSecret"
          DATABASE_HOST: "localhost"
          DATABASE_PORT: "5432"
          DATABASE_NAME: "omni_db"
          DATABASE_USERNAME: "postgres"
          DATABASE_PASSWORD: "password"
          DATABASE_SSL: "false"

      - name: Typecheck Web
        run: npx tsc --noEmit
        working-directory: web

      # socket/ is not an npm workspace and turbo therefore never sees it, so
      # until now nothing here compiled it — a dependency bump for the gateway
      # could go green without a single line being type-checked.
      - name: Install & build socket
        run: npm ci && npm run build
        working-directory: socket

      # Building is not starting. A dependency bump once passed this workflow
      # twice and then failed at `Strapi.register` with a module it could not
      # resolve — the CMS crash-looped in production while CI stayed green.
      # This boots Strapi against the throwaway database above and waits for it
      # to answer. Seeding is skipped: the question is whether it starts.
      - name: Smoke test — does the CMS actually start?
        working-directory: cms
        env:
          SKIP_DEMO_SEED: "true"
          DEMO_MODE: "false"
          HOST: 127.0.0.1
          PORT: "1337"
          APP_KEYS: "dummy,keys"
          API_TOKEN_SALT: "dummySalt"
          ADMIN_JWT_SECRET: "dummySecret"
          TRANSFER_TOKEN_SALT: "dummySalt2"
          JWT_SECRET: "dummyJwtSecret"
          DATABASE_CLIENT: postgres
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: "5432"
          DATABASE_NAME: omni_ci
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_SSL: "false"
        run: |
          npm start > /tmp/strapi.log 2>&1 &
          STRAPI_PID=$!
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:1337/admin; then
              echo "Strapi answered after ${i}s"
              kill $STRAPI_PID 2>/dev/null || true
              exit 0
            fi
            if ! kill -0 $STRAPI_PID 2>/dev/null; then
              echo "::error::Strapi exited before answering"
              tail -60 /tmp/strapi.log
              exit 1
            fi
            sleep 1
          done
          echo "::error::Strapi did not answer within 60s"
          tail -60 /tmp/strapi.log
          kill $STRAPI_PID 2>/dev/null || true
          exit 1
