# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Root-Workspaces: cms, web, packages/* teilen ein Lockfile
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      production: { dependency-type: production }
      development: { dependency-type: development }
    ignore:
      # Ein Major-Sprung bei Next oder Strapi ist ein Projekt, kein PR.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@strapi/*"
        update-types: ["version-update:semver-major"]

  # socket/ liegt ausserhalb der Workspaces und hat ein eigenes Lockfile
  - package-ecosystem: npm
    directory: "/socket"
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      all: { patterns: ["*"] }

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
