# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Root-Workspaces: cms, web, packages/* teilen ein Lockfile
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      # Nur Minor und Patch werden gebündelt. Ein Major kommt als eigener PR,
      # weil sonst ein einziger Bruch die ganze Gruppe rot färbt und auch die
      # harmlosen Aktualisierungen darin nicht mehr eingespielt werden können.
      production:
        dependency-type: production
        update-types: ["minor", "patch"]
      development:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # Ein Major-Sprung bei Next oder Strapi ist ein Projekt, kein PR.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@strapi/*"
        update-types: ["version-update:semver-major"]

  # socket/ liegt ausserhalb der Workspaces und hat ein eigenes Lockfile
  - package-ecosystem: npm
    directory: "/socket"
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      all:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
